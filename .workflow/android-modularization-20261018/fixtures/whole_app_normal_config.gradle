// These two unchanged tests already executed successfully with task-only OAuth
// credentials in phase-5-complete-app-behavior-corrected-fixture. The normal
// build deliberately has no Antigravity client configured. Keep its real
// BuildConfig for the remaining full suite and installed APKs.
allprojects {
    tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
        if (path == ':app:testFullDebugUnitTest') {
            filter.excludeTestsMatching('app.amber.ai.provider.providers.google.AntigravityOAuthSessionTest')
        }
    }
}
